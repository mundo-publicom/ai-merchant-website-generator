name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs wait rather than cancel a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build
        env:
          # Project sites live at https://<user>.github.io/<repo>/, so assets
          # need that prefix. Serving from a custom domain or a <user>.github.io
          # repo instead? Set BASE_PATH to "/".
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional public URL of a deployed enhancement endpoint. This is
          # baked into the JS bundle, so it must be a URL - NEVER an API key.
          VITE_ENHANCE_URL: ${{ vars.VITE_ENHANCE_URL }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
